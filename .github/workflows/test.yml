name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.31.1
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, libxml, json
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run every suite
        run: bash bin/test.sh

  secret-scan:
    name: Secret scan (generic rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The local denylist (.scan-secrets.local) is git-ignored, so only the generic rules run here.
      - name: Scan tracked files
        run: bash bin/scan-secrets.sh
